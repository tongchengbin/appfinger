name: Performance comparison

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Baseline branch, tag or commit (must support current scanner API)
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOMAXPROCS: '1'
      GOTOOLCHAIN: local
      BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base_ref }}
      HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.base_ref }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: |
            candidate/go.sum
            baseline/go.sum
      - name: Prepare identical harness and record environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results baseline/benchmarks
          # Replace only the isolated harness; never copy production code.
          python3 - <<'PY'
          import shutil
          shutil.rmtree('baseline/benchmarks')
          shutil.copytree('candidate/benchmarks', 'baseline/benchmarks')
          PY
          {
            go version
            uname -a
            lscpu
            echo "base=$(git -C baseline rev-parse HEAD)"
            echo "head=$(git -C candidate rev-parse HEAD)"
            echo 'dataset=synthetic-v1; GOMAXPROCS=1; cpu=1; benchtime=1s; samples=10'
            find candidate/benchmarks -type f -print0 | sort -z | xargs -0 sha256sum
          } > results/environment.txt
      - name: Compile both versions before measuring
        shell: bash
        run: |
          set -euo pipefail
          (cd baseline && go test -c -o "$GITHUB_WORKSPACE/results/base.test" ./benchmarks)
          (cd candidate && go test -c -o "$GITHUB_WORKSPACE/results/head.test" ./benchmarks)
          go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e
      - name: Warm up and collect alternating samples
        shell: bash
        run: |
          set -euo pipefail
          for version in base head; do
            "./results/$version.test" -test.run='^$' -test.bench=. -test.benchmem -test.cpu=1 -test.benchtime=1x > "results/$version-warmup.txt"
          done
          for sample in $(seq 1 10); do
            if (( sample % 2 )); then order='base head'; else order='head base'; fi
            for version in $order; do
              "./results/$version.test" -test.run='^$' -test.bench=. -test.benchmem -test.cpu=1 -test.benchtime=1s >> "results/$version.txt"
            done
          done
      - name: Publish comparison
        shell: bash
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/benchstat" results/base.txt results/head.txt > results/comparison.txt
          {
            echo '## AppFinger performance comparison'
            echo 'Same runner, identical synthetic-v1 harness, 10 alternating samples per version.'
            echo 'Timing changes are informational; benchmark correctness failures fail the job.'
            echo '```text'
            cat results/comparison.txt
            echo '```'
            echo '### Environment'
            echo '```text'
            cat results/environment.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/*.txt
          retention-days: 30
